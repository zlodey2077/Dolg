# pre-commit hooks. Установка:
#   pip install pre-commit
#   pre-commit install
#
# Сразу проверить весь репо:
#   pre-commit run --all-files
#
# Хуки бегут только на стейджированных файлах при `git commit`.
# Если хочется skip разово: `git commit --no-verify` (но это плохая идея).

repos:
  # === Базовые гигиенические проверки ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: \.(vscode|claude)/.*\.json$
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-merge-conflict
      - id: detect-private-key

  # === Ruff: линтер + формат + isort, всё в одном бинаре ===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # === Django-специфичные ===
  - repo: local
    hooks:
      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        pass_filenames: false
        # Не самый дешёвый хук, гоняем только при изменении settings/urls/views
        files: \.(py)$
        stages: [pre-commit]

  # === Security: SAST (bandit) + secret detection (gitleaks) ===
  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.10'
    hooks:
      - id: bandit
        # B101 assert — норм для тестов. B404/B603 subprocess — используем безопасно
        # (cmd как list, shell=False) в Dolg_APP/views.py:1002 для DWG-конвертера.
        args:
          - --skip
          - B101,B404,B603
          - --exclude
          - tests,migrations,.venv,node_modules
        files: \.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.1
    hooks:
      - id: gitleaks

  # === Supply-chain CVE scan (pip-audit) ===
  # Запускаем только при `git push` — он тянет CVE-БД из pypa/advisory-database,
  # это медленно для каждого commit'а. На pre-push достаточно.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (CVE scan)
        entry: pip-audit
        language: python
        additional_dependencies: ['pip-audit==2.8.0']
        args: ['-r', 'requirements.txt', '--strict', '--disable-pip']
        pass_filenames: false
        stages: [pre-push]
