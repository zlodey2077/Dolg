{% extends "shop/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="auth-form-card">
        <h1>Регистрация</h1>

        <form method="post" class="auth-form" aria-label="Форма регистрации">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required
                       class="form-control"
                       autocomplete="username"
                       aria-required="true"
                       maxlength="150"
                       autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required
                       class="form-control"
                       autocomplete="email"
                       aria-required="true"
                       aria-describedby="email-hint">
                <small id="email-hint" class="form-hint" hidden></small>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required
                           class="form-control"
                           autocomplete="new-password"
                           aria-required="true"
                           aria-describedby="password-hint"
                           minlength="8">
                    <button type="button" class="password-toggle" data-target="password"
                            aria-label="Показать пароль" title="Показать/скрыть пароль">👁</button>
                </div>
                <small id="password-hint" class="form-hint">
                    Минимум 8 символов, не только цифры, не похож на имя/email.
                </small>
            </div>

            <div class="form-group">
                <label for="password_confirm">Подтверждение пароля:</label>
                <div class="password-field">
                    <input type="password" id="password_confirm" name="password_confirm" required
                           class="form-control"
                           autocomplete="new-password"
                           aria-required="true">
                    <button type="button" class="password-toggle" data-target="password_confirm"
                            aria-label="Показать пароль" title="Показать/скрыть пароль">👁</button>
                </div>
                <small id="password-match-hint" class="form-hint" hidden></small>
            </div>

            <button type="submit" class="btn btn-success auth-submit">Зарегистрироваться</button>
        </form>

        <p class="auth-form-link">
            Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a>
        </p>
</div>

<script>
(function () {
    'use strict';

// Email-валидация по мере ввода: показываем подсказку под полем.
// Раньше неверный email замечался только при submit — пользователь успевал
// ввести пароль и нажать «Зарегистрироваться», получая ошибку с нуля.
const emailInput = document.getElementById('email');
const emailHint  = document.getElementById('email-hint');
const EMAIL_RE   = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (emailInput && emailHint) {
    emailInput.addEventListener('input', () => {
        const v = emailInput.value.trim();
        if (!v) { emailHint.hidden = true; return; }
        const ok = EMAIL_RE.test(v);
        emailHint.hidden = false;
        emailHint.textContent = ok ? '✓ Корректный email' : '⚠ Похоже на не email — должен быть вида user@example.com';
        emailHint.classList.toggle('form-hint--ok', ok);
        emailHint.classList.toggle('form-hint--warn', !ok);
    });
}

// Проверка совпадения паролей по мере ввода.
const pw  = document.getElementById('password');
const pw2 = document.getElementById('password_confirm');
const pwHint = document.getElementById('password-match-hint');
function checkPwMatch() {
    if (!pw2.value) { pwHint.hidden = true; return; }
    const ok = pw.value === pw2.value;
    pwHint.hidden = false;
    pwHint.textContent = ok ? '✓ Пароли совпадают' : '⚠ Пароли не совпадают';
    pwHint.classList.toggle('form-hint--ok', ok);
    pwHint.classList.toggle('form-hint--warn', !ok);
}
if (pw && pw2 && pwHint) {
    pw.addEventListener('input', checkPwMatch);
    pw2.addEventListener('input', checkPwMatch);
}
})();
</script>
{% endblock %}
