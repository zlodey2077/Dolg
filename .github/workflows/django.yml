name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Pin ruff к той же версии что в .pre-commit-config.yaml — иначе
      # local и CI расходятся по правилам форматирования (видели в run #16-18).
      - run: pip install 'ruff==0.15.13'
      - name: Ruff lint
        run: ruff check Dolg_APP shop accounts orders knowledge Dolg_PR
      - name: Ruff format check
        run: ruff format --check Dolg_APP shop accounts orders knowledge Dolg_PR

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan dependencies for known CVEs
        # exit-code != 0 если найдена уязвимость → CI красный.
        # Падающие dev-зависимости (pytest, ruff) исключаем через --ignore-vuln,
        # если возникнут шумные false-positives — добавлять сюда.
        run: pip-audit --requirement requirements.txt --strict

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: "Dolg_PR.settings_test"
      SECRET_KEY: "ci-only-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://localhost"
      FAST_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Django system check
        run: python manage.py check

      - name: Production-config asserter
        # Симулируем prod-окружение и проверяем, что check_prod_settings
        # ловит дефолтный SECRET_KEY (SKIP_PROD_CHECKS=1 чтобы не fail-ить CI,
        # а просто увидеть warnings).
        env:
          DEBUG: "False"
          SECRET_KEY: "django-insecure-local-development-key-change-me"
          ALLOWED_HOSTS: ""
          SKIP_PROD_CHECKS: "1"
        run: python manage.py check_prod_settings

      - name: Tests with coverage
        run: |
          coverage run manage.py test accounts shop orders Dolg_APP knowledge
          coverage report -m --fail-under=40
          coverage html -d coverage_html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 14
