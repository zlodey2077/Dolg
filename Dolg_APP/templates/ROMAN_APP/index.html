{% load static %}

<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOLG - Главная</title>
        <link rel="stylesheet" href="{% static 'shop/styles.css' %}">
        <link rel="stylesheet" href="{% static 'shop/cosmic_flex.css' %}">
        <link rel="stylesheet" href="{% static 'ROMAN_APP/styles.css' %}">
        <link rel="stylesheet" href="{% static 'project1_1/main.css' %}">
        <style>
            .page-container {
                display: flex;
                flex-direction: column;
                min-height: 100%;
                flex: 1;
            }

            .hero-section {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: var(--gap-xl);
                text-align: center;
                flex: 1;
                padding: var(--spacing-2xl) var(--spacing-lg);
            }

            .hero-title {
                font-size: 3rem;
                background: linear-gradient(135deg, #00d4ff, #90ee90);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                margin: 0;
                font-weight: bold;
            }

            .hero-description {
                font-size: 1.3rem;
                color: #b0b0b0;
                max-width: 600px;
                margin: 0;
            }

            .tools-container {
                display: flex;
                flex-direction: row;
                gap: var(--gap-lg);
                flex-wrap: wrap;
                justify-content: center;
                margin-top: var(--spacing-xl);
            }

            .tool-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: var(--gap-md);
                padding: var(--spacing-xl);
                background: rgba(10, 14, 39, 0.6);
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                min-width: 220px;
                cursor: pointer;
                transition: all 0.3s ease;
                text-decoration: none;
                color: inherit;
            }

            .tool-card:hover {
                background: rgba(0, 212, 255, 0.1);
                border-color: #00d4ff;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
                transform: translateY(-8px);
            }

            .tool-icon {
                font-size: 3rem;
            }

            .tool-title {
                font-size: 1.3rem;
                font-weight: 600;
                color: #00d4ff;
                margin: 0;
            }

            .tool-description {
                font-size: 0.95rem;
                color: #a0a0a0;
                text-align: center;
                margin: 0;
            }

            @media (max-width: 768px) {
                .hero-title {
                    font-size: 2rem;
                }

                .hero-description {
                    font-size: 1.1rem;
                }

                .tools-container {
                    flex-direction: column;
                }

                .tool-card {
                    min-width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <main class="flex-1">
            <div class="page-container">
                <section class="hero-section">
                    <h1 class="hero-title">DOLG</h1>
                    <p class="hero-description">
                        Модульная платформа для инженерного проектирования и моделирования систем
                    </p>

                    <div class="tools-container">
                        <!-- Симуляция -->
                        <a href="{% url 'hello:simulation' %}" class="tool-card">
                            <div class="tool-icon">⚙️</div>
                            <h2 class="tool-title">Симуляция</h2>
                            <p class="tool-description">Интерактивная схема с компонентами и проводами</p>
                        </a>

                        <!-- 2D САПР -->
                        <a href="{% url 'hello:cad' %}" class="tool-card">
                            <div class="tool-icon">📐</div>
                            <h2 class="tool-title">2D САПР</h2>
                            <p class="tool-description">Профессиональный инструмент черчения</p>
                        </a>

                        <!-- Проекты -->
                        <a href="{% url 'hello:projects' %}" class="tool-card">
                            <div class="tool-icon">📁</div>
                            <h2 class="tool-title">Проекты</h2>
                            <p class="tool-description">Управление вашими проектами</p>
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
