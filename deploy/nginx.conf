# nginx reverse-proxy для DOLG. Раздаёт статику и media напрямую (быстро),
# проксирует динамику на gunicorn-контейнер web:8000.
# Прицельно НЕ настраиваем https — это задача внешнего туннеля
# (cloudflared / ngrok / production load-balancer).

upstream dolg_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;     # avatars и BOM-xlsx уложатся

    # Безопасность: базовые заголовки. CSP не выставляем — у нас inline JS
    # в simulation.html (пока), CSP его сломает. После рефакторинга на Vite
    # можно добавить strict CSP.
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "DENY"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Статика — отдаём напрямую с диска volume-а, минуя Django.
    # ManifestStaticFilesStorage генерит хешированные имена → можно кешировать
    # навечно (immutable).
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media (avatars и пользовательские загрузки). Кеш короче — могут меняться.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # Прокси-pass для всего динамического трафика.
    location / {
        proxy_pass http://dolg_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
