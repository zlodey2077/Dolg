# nginx reverse-proxy для DOLG. Раздаёт статику и media напрямую (быстро),
# проксирует HTTP на gunicorn-контейнер web:8000, а WebSocket на ASGI
# контейнер asgi:8001.
# Прицельно НЕ настраиваем https — это задача внешнего туннеля
# (cloudflared / ngrok / production load-balancer).

upstream dolg_web {
    server web:8000;
}

upstream dolg_asgi {
    server asgi:8001;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 10M;     # avatars и BOM-xlsx уложатся

    # Безопасность: базовые заголовки. CSP не выставляем — у нас inline JS
    # в simulation.html (пока), CSP его сломает. После рефакторинга на Vite
    # можно добавить strict CSP.
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "DENY"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Статика — отдаём напрямую с диска volume-а, минуя Django.
    # ManifestStaticFilesStorage генерит хешированные имена → можно кешировать
    # навечно (immutable).
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media (avatars и пользовательские загрузки). Кеш короче — могут меняться.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # Прокси-pass для всего динамического трафика.
    # Prometheus scrapes web:8000 inside Docker. Keep /metrics private on the
    # public nginx edge because it exposes view names, latency and DB activity.
    location = /metrics/ {
        access_log off;
        return 403;
    }

    location = /metrics {
        access_log off;
        return 403;
    }

    location /ws/ {
        proxy_pass http://dolg_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://dolg_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
