# Auto-provisioning источника данных Prometheus при первом старте Grafana.
# Файл монтируется в /etc/grafana/provisioning/datasources/ через docker-compose.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
