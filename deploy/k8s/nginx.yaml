apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    upstream dolg_web {
        server dolg-web:8000;
    }

    upstream dolg_asgi {
        server dolg-asgi:8001;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 50m;

        location = /metrics {
            return 403;
        }

        location = /metrics/ {
            return 403;
        }

        location /static/ {
            alias /var/www/static/;
            access_log off;
            expires 7d;
        }

        location /media/ {
            alias /var/www/media/;
            expires 1h;
        }

        location /ws/ {
            proxy_pass http://dolg_asgi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://dolg_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: dolg-nginx
  labels:
    app.kubernetes.io/name: dolg
    app.kubernetes.io/component: edge
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: dolg
    app.kubernetes.io/component: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dolg-nginx
  labels:
    app.kubernetes.io/name: dolg
    app.kubernetes.io/component: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dolg
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dolg
        app.kubernetes.io/component: edge
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: staticfiles
              mountPath: /var/www/static
              readOnly: true
            - name: media
              mountPath: /var/www/media
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: staticfiles
          persistentVolumeClaim:
            claimName: django-staticfiles
        - name: media
          persistentVolumeClaim:
            claimName: django-media
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
