# Production-like stack: Django WSGI + Django ASGI + Celery worker +
# Postgres + Redis + nginx + Prometheus/Grafana.
#
# Usage from repo root:
#   1. Copy .env.example -> .env and fill SECRET_KEY, POSTGRES_PASSWORD,
#      EMAIL_BACKEND and GRAFANA_ADMIN_PASSWORD.
#   2. docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   3. http://localhost/ -> DOLG through nginx.

x-django-build: &django-build
  context: ..
  dockerfile: deploy/Dockerfile

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: "Dolg_PR.settings_prod"
  SECRET_KEY: "${SECRET_KEY:?need SECRET_KEY in .env}"
  DEBUG: "${DEBUG:-False}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-https://*.trycloudflare.com,https://*.ngrok-free.app}"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-dolg}:${POSTGRES_PASSWORD:?need POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dolg}"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/1}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/2}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  HF_TOKEN: "${HF_TOKEN:-}"
  SENTRY_DSN: "${SENTRY_DSN:-}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-DOLG <noreply@dolg.local>}"
  EMAIL_BACKEND: "${EMAIL_BACKEND:?need non-console EMAIL_BACKEND in .env}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  USE_MANIFEST_STATIC: "${USE_MANIFEST_STATIC:-1}"
  SERVE_MEDIA: "${SERVE_MEDIA:-0}"
  DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-}"
  DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"
  DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-}"

x-django-hardening: &django-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dolg}"
      POSTGRES_USER: "${POSTGRES_USER:-dolg}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?need POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dolg} -d ${POSTGRES_DB:-dolg}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"

  web:
    build: *django-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      RUN_CREATE_SUPERUSER: "1"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.5"
    <<: *django-hardening

  asgi:
    build: *django-build
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "Dolg_PR.asgi:application"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      RUN_CREATE_SUPERUSER: "0"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles:ro
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    <<: *django-hardening

  worker:
    build: *django-build
    command:
      [
        "celery",
        "-A",
        "Dolg_PR",
        "worker",
        "--loglevel=${CELERY_LOG_LEVEL:-INFO}",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}",
      ]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      RUN_CREATE_SUPERUSER: "0"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles:ro
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    <<: *django-hardening

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      asgi:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.7.5
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?need GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles:
  prometheus_data:
  grafana_data:
