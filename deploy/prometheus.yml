# Prometheus конфиг для DOLG: один scrape-target — Django endpoint /metrics/,
# который django-prometheus отдаёт автоматически после добавления MIDDLEWARE.
#
# Метрики, которые сразу появятся:
#   django_http_requests_total_by_method           — счётчик запросов по методам
#   django_http_responses_total_by_status          — счётчик ответов по статусам
#   django_http_requests_latency_seconds_by_view   — гистограмма latency по view
#   django_db_execute_total                        — счётчик SQL-запросов
#   django_db_query_duration_seconds               — длительность SQL
#   django_model_inserts_total / updates / deletes — мутации моделей
#
# Раскрутить ровно через docker compose -f deploy/docker-compose.yml up -d
# → Grafana на http://localhost:3000 (admin + GRAFANA_ADMIN_PASSWORD из .env),
# Prometheus на http://localhost:9090.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dolg-django'
    metrics_path: '/metrics'
    authorization:
      # Local/demo token. Keep it in sync with METRICS_TOKEN for Django.
      # For production, replace this config through your secret supply.
      credentials: 'local-metrics-token-change-me'
    static_configs:
      - targets: ['web:8000']
        labels:
          service: 'dolg-web'
          env: 'production'

  # Headroom proxy — для инсталляций с запущенным
  # LOCAL_AI_PROXY_URL=http://127.0.0.1:8787 (либо отдельным
  # docker-сервисом). Метрики: requests_total, cached_total,
  # rate_limited_total, compression ratio, token-savings.
  - job_name: 'headroom-proxy'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8787']
        labels:
          service: 'headroom'
          env: 'dev'

  - job_name: 'prometheus-self'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          env: 'production'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          env: 'production'

  - job_name: 'containers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker'
          env: 'production'
